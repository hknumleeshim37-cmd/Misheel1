<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Монгол Үндэсний Ресторан</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --slate: #2d3b45;
      --gold: #dfa86c;
      --text: #2c3e50;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--text);
      font-family: 'Montserrat', 'Segoe UI', Tahoma, sans-serif;
    }

    /* Дээд хэсэг */
    .hero {
      background: var(--slate);
      color: #fff;
      text-align: center;
      padding: 70px 20px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Цэс */
    .menu {
      max-width: 860px;
      margin: 0 auto;
      padding: 50px 20px 70px;
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--slate);
      text-align: center;
      margin: 50px 0 34px;
    }
    .section-title:first-child { margin-top: 0; }
    .section-title::after {
      content: '';
      display: block;
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 12px auto 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px 32px;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }

    .dish img {
      display: block;
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 14px;
      background: #e8e8e8;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    .dish-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: 1px dotted #bbb;
      padding-bottom: 6px;
    }
    .dish-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--slate);
    }
    .dish-price {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1>Монгол Үндэсний Ресторан</h1>
  </header>

  <main class="menu">

    <h2 class="section-title">Үндсэн хоол</h2>
    <div class="grid">

      <div class="dish">
        <img src="Buuz.jpg" alt="Жигнэсэн бууз" loading="lazy">
        <div class="dish-info"><span class="dish-name">Жигнэсэн бууз</span><span class="dish-price">20,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="Tsuivan.jpg" alt="Цуйван" loading="lazy">
        <div class="dish-info"><span class="dish-name">Цуйван</span><span class="dish-price">16,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="khuushuur.jpg" alt="Хуушуур" loading="lazy">
        <div class="dish-info"><span class="dish-name">Хуушуур бууз сет</span><span class="dish-price">20,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="banshtai-shul.jpg" alt="Банштай шөл" loading="lazy">
        <div class="dish-info"><span class="dish-name">Банштай шөл</span><span class="dish-price">15,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="horhog.jpg" alt="Хорхог сет" loading="lazy">
        <div class="dish-info"><span class="dish-name">Хорхог сет</span><span class="dish-price">50,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="chanasan-mah.jpg" alt="Чанасан мах" loading="lazy">
        <div class="dish-info"><span class="dish-name">Чанасан мах</span><span class="dish-price">40,000 ₮</span></div>
      </div>

    </div>

    <h2 class="section-title">Дагалдах хоол, цай</h2>
    <div class="grid">

      <div class="dish">
        <img src="niislel-salad.jpg" alt="Нийслэл салад" loading="lazy">
        <div class="dish-info"><span class="dish-name">Нийслэл салад</span><span class="dish-price">14,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="nogooni-salad.jpg" alt="Ногооны салад" loading="lazy">
        <div class="dish-info"><span class="dish-name">Ногооны салад</span><span class="dish-price">14,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="suutei-tsai.jpg" alt="Сүүтэй цай" loading="lazy">
        <div class="dish-info"><span class="dish-name">Сүүтэй цай</span><span class="dish-price">2,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="undaa.jpg" alt="Ундаа" loading="lazy">
        <div class="dish-info"><span class="dish-name">Ундаа</span><span class="dish-price">3,000 ₮</span></div>
      </div>

      <div class="dish">
        <img src="Raisin.jpg" alt="Үзэмний шүүс" loading="lazy">
        <div class="dish-info"><span class="dish-name">Үзэмний шүүс</span><span class="dish-price">3,000 ₮</span></div>
      </div>

    </div>

  </main>

</body>
</html>
